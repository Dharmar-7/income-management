name: Keep API Warm

# Why: the API is a Render service. On the free tier it sleeps after ~15 min
# with no inbound HTTP (a ~50s cold start on the next request). We ping the
# SHALLOW /health endpoint (no DB query) to keep the Render dyno warm.
#
# We deliberately do NOT ping /health/deep here. That endpoint runs SELECT 1,
# which wakes the Neon compute and keeps it from autosuspending — and a compute
# pinned awake 24/7 is exactly what exhausted the Neon free-tier compute quota
# (see: outage where every query returned P1001). Letting Neon autosuspend costs
# a ~2-5s resume on the first real query after idle, which is an acceptable
# trade for staying inside the free compute budget.
#
# Note: GitHub's scheduled runners can be delayed 5-15 min under load; that only
# means the Render dyno may occasionally cold-start, never a correctness issue.

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes
  workflow_dispatch:          # allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping shallow health endpoint (wakes Render only)
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 \
              https://income-management-xo9d.onrender.com/health)
            echo "Attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 20
          done
          # Don't hard-fail the workflow on a transient blip — the shallow health
          # endpoint has no DB dependency, so a non-200 here just means Render was
          # mid-cold-start. Warn instead of exit 1 to avoid noisy failure emails.
          echo "::warning::Health check did not return 200 after 3 attempts (Render may have been cold-starting)"
